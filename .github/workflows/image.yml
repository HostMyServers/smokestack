name: image
# Builds and pushes the container image for one tag.
#
# Two entry points, one definition. The release workflow calls it, and it can
# also be run by hand from Actions with a tag — because an image build can
# fail for reasons that have nothing to do with the release it accompanies (a
# registry outage, a skipped job), and the remedy for that should not be
# burning a version number.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, with the leading v (e.g. v0.6.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, with the leading v (e.g. v0.6.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # The tag must exist and must be a tag: building "main" and pushing it
      # as a version would put something unreleased behind a version number.
      # It travels through the environment rather than into the script, and
      # the character class is checked before its shape: the tag is typed by
      # whoever starts the run, `run:` is a shell, and a git ref name may
      # carry a semicolon.
      - name: The tag must exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            *[!0-9A-Za-z.-]*) echo "not a tag name: $TAG" >&2; exit 1 ;;
            v[0-9]*) ;;
            *) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
          git fetch --tags --force --quiet
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "tag $TAG does not exist" >&2; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # latest moves only for a final version: a pre-release tag carries its
      # own tag and nothing else, so an automatic puller never lands on one.
      - name: Decide whether latest moves
        id: t
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A registry refuses an image path carrying an upper-case letter,
          # and github.repository spells the owner as GitHub does. The
          # upstream owner happens to be lower-case, so this only ever fails
          # in a fork — at the last step of a release, after the packages
          # are already published.
          REPO=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          # A multi-line output needs a delimiter; a bare "k=a\nb" would set
          # the first line and drop the rest.
          {
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/$REPO:$TAG"
            case "$TAG" in
              *-*) ;;                        # pre-release: latest stays put
              *)   echo "ghcr.io/$REPO:latest" ;;
            esac
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.tag }}
          push: true
          tags: ${{ steps.t.outputs.tags }}
