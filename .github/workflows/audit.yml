name: audit
# What judges the code, as opposed to what proves it builds: known
# vulnerabilities in the dependencies, in the standard library and in the
# container base, plus the static analysis and the formatting gate that were
# written down as mandatory and enforced nowhere.
#
# A file of its own rather than four more jobs in ci.yml, for one reason: the
# schedule. A vulnerability published the day after a merge is caught by
# nothing that only runs on a push, and this repository ships signed binaries
# that instances install by themselves within hours. The Monday run is the one
# that can tell you a released version became vulnerable without a line of it
# changing.
#
# Four jobs, one per surface, deliberately independent: a CVE in a Go module
# and a shell quoting bug are not the same news, and reading which one is red
# should not mean opening a log.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner version is pinned for the same reason as in ci.yml: an audit that
# starts judging a different distribution the day GitHub moves a label reports
# a change nobody made.
jobs:
  # gofmt, vet, staticcheck, govulncheck — all four through `make audit`, so
  # that what runs here is what a contributor can run before pushing. The
  # versions of the two analysers are pinned in the Makefile for the same
  # reason.
  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Put the Go tool directory on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The two analysers compile from source, which is most of this job's
      # time. Keyed on the Makefile, which is where their versions are pinned:
      # it moves more often than they do, and a miss costs a minute rather
      # than a wrong answer. No restore-keys — a partial hit would put the
      # previous version's binaries back, and this cache exists to serve an
      # exact one.
      - name: Cache the analysers
        id: tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: audit-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Install the analysers
        if: steps.tools.outputs.cache-hit != 'true'
        run: make audit-tools
      # The vulnerability database is fetched on every run, and that is the
      # point of this step: a cached verdict on last week's advisories is not
      # a verdict. Only the binaries are cached.
      - name: Audit the Go code
        run: make audit

  # install.sh is seventeen kilobytes of POSIX shell that runs as root on a
  # machine its author will never see, and ci.yml only ever checked that it
  # parses. `sh -n` accepts every quoting bug there is.
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned, rather than whatever apt carries. The runner's 0.9.0 and the
      # current 0.11.0 disagree about this very file: the older one raises
      # SC2015 on two `[ a ] && [ b ] || die` lines, where the idiom does
      # exactly what it reads as, and upstream has since stopped flagging it.
      # A check whose findings move with the runner image is a check that goes
      # red on a branch that changed nothing.
      - name: Audit the shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR install.sh scripts/*.sh

  # The workflows are the most privileged thing in the repository: one of them
  # holds the release signing key and publishes binaries that instances
  # install without being asked. They are worth auditing as an attack surface
  # and not only as YAML.
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Put the Go tool directory on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Expression typos, shell syntax inside `run:`, inputs that do not
      # exist, action arguments that are ignored. It runs ShellCheck over
      # every `run:` block, which is how it caught an unquoted command
      # substitution in this very job.
      - name: Lint the workflows
        run: actionlint
      - name: Install zizmor
        run: pipx install zizmor==1.30.1
      # zizmor reads a workflow the way an attacker would: what a `run:` block
      # interpolates, what a token is allowed to do, what a cache can poison.
      # It is what pointed at the interpolated values and the workflow-wide
      # write token that this branch also fixes in release.yml.
      #
      # High severity and high confidence only. The rest is printed and not
      # blocked on purpose — persisted checkout credentials and a cache that
      # could in principle be poisoned are real, and they are not worth a red
      # build on a branch that touched neither. GITHUB_TOKEN is passed because
      # zizmor runs a reduced audit set offline, and the one it leaves out
      # includes the published advisories on the actions themselves.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity high --min-confidence high .github/workflows/

  # The image is rebuilt rather than pulled: what is judged is what the
  # Dockerfile produces today, on today's base, which is the thing a release
  # would push.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # First, because it needs no build: the Dockerfile itself, against the
      # container checks — a root user, a writable filesystem, a secret baked
      # into a layer.
      - name: Scan the Dockerfile
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.75.0 config \
            --exit-code 1 /scan
      - name: Build the image
        run: docker build -t smokestack:audit .
      # Through a saved tarball rather than the daemon: handing the Docker
      # socket to a container is handing it root on the runner, and a scanner
      # needs to read an image, not to drive a daemon.
      - name: Save the image
        run: docker save smokestack:audit -o image.tar
      # Two reasons to fail here, and the second is the one that matters.
      #
      # --exit-code 1 is the obvious one: a HIGH or CRITICAL in the base image
      # that a rebuild would fix. --ignore-unfixed, because a CVE with no
      # patch published is not something this repository can act on, and a
      # permanent red build teaches people to stop reading.
      #
      # --exit-on-eol 1 is the one this file was written for. The base was
      # alpine:3.20, which has stopped receiving security updates: the scan
      # reported zero vulnerabilities, and that zero only meant that nobody
      # publishes advisories for it any more. An unmaintained base is the one
      # case where a clean report is itself the symptom, so it has to fail on
      # its own terms rather than wait for a finding that can no longer come.
      #
      # Trivy is pinned, and its age costs little: the database is downloaded
      # on every run, so a pinned binary still reports this week's advisories.
      - name: Scan the image
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.75.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --exit-on-eol 1 --input /scan/image.tar
