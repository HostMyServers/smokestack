# ST1005 ("error strings should not be capitalized / end with punctuation") is
# off because it cannot be satisfied consistently here: it refuses
# "Telegram needs a bot token" and "Twilio needs an account SID" while
# accepting "SMTP needs a server", "OVH SMS needs the three keys" and
# "GatewayAPI needs a token" three lines away in the same switch — the
# difference is the case of the brand name, not the style of the message.
# Rewording two of seven would make notify.go less consistent, not more.
# It also flags the trailing "..." of a usage string, which is how usage
# strings are written.
checks = ["inherit", "-ST1005"]
