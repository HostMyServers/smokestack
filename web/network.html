<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>Host network — smokestack</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="hdr" id="hdr"></header>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow" data-i18n="nav.network"></p>
    <h1 id="title"></h1>
    <p class="lead" data-i18n="net.lead"></p>
  </div>
  <div id="body"><p class="muted" data-i18n="common.loading"></p></div>
</main>
<footer class="ftr" id="ftr"></footer>
<script src="/html.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
const { html, url } = H;
let INFO = null, ERR = null, PENDING = false;

// Tout ce que cette page affiche vient de RIPEstat et de PeeringDB :
// noms de reseaux, de points d'echange, d'installations, et des adresses
// que personne ici ne controle. Le gabarit echappe, et url() refuse ce
// qui n'est pas http(s) avant qu'une adresse atteigne un href.
const kv = rows => html`<div class="kv">${rows
  .filter(r => r[1] !== "" && r[1] != null)
  .map(r => html`<div class="k">${r[0]}</div><div class="v">${r[1]}</div>`)}</div>`;

const stat = (label, value) =>
  html`<div class="card card-b stat"><div class="k">${label}</div><div class="v">${value}</div></div>`;

const link = (href, label) => {
  const u = url(href);
  return u && html`<a href="${u}" rel="noopener">${label}</a>`;
};

function routingCard(t, i) {
  return html`<div class="card"><div class="card-b">
    <div class="section-h"><h2>${t("net.routing")}</h2><span class="sub">RIPEstat</span></div>
    ${kv([
      [t("net.holder"), i.holder],
      [t("net.country"), i.country],
      [t("net.announced"), i.announced
        ? html`<span class="badge b-ok">${t("common.yes")}</span>`
        : html`<span class="badge b-crit">${t("common.no")}</span>`],
      [t("net.nb_up"), I18N.num(i.nb_upstreams)],
      [t("net.nb_down"), I18N.num(i.nb_downstreams)],
      [t("net.nb_all"), I18N.num(i.nb_neighbours)]
    ])}
  </div></div>`;
}

function declaredCard(t, p) {
  if (!p) return html`<div class="card"><div class="card-b">
    <div class="section-h"><h2>${t("net.declared")}</h2><span class="sub">PeeringDB</span></div>
    <p class="muted">${t("net.not_in_pdb")}</p></div></div>`;
  return html`<div class="card"><div class="card-b">
    <div class="section-h"><h2>${t("net.declared")}</h2><span class="sub">PeeringDB</span></div>
    ${kv([
      [t("net.types"), (p.types || []).join(", ")],
      [t("net.policy"), html`${p.policy}${p.policy_url && html` \u00b7 ${link(p.policy_url, "\u2197")}`}`],
      [t("net.traffic"), p.traffic],
      [t("net.ratio"), p.ratio],
      [t("net.scope"), p.scope],
      [t("net.irr"), p.irr_as_set && html`<span class="mono">${p.irr_as_set}</span>`],
      [t("net.lg"), link(p.looking_glass, "\u2197")],
      [t("net.website"), link(p.website, String(p.website || "").replace(/^https?:\/\//, ""))]
    ])}
  </div></div>`;
}

function upstreams(t, list) {
  const max = Math.max(...list.map(u => u.power), 1);
  return html`<section class="section"><div class="section-h"><h2>${t("net.upstreams")}</h2></div>
    <div class="card"><div class="card-b">${list.map(u => html`
      <div style="display:grid;grid-template-columns:110px minmax(0,1fr) 160px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)">
        <a class="mono" href="https://bgp.tools/as/${u.asn}" rel="noopener">AS${u.asn}</a>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.name || ""}</span>
        <span style="height:6px;border-radius:var(--radius-xs);background:var(--bg-sunk);overflow:hidden">
          <i style="display:block;height:100%;width:${Math.round(u.power / max * 100)}%;background:var(--accent)"></i></span>
      </div>`)}
      <p class="faint" style="font-size:12px;margin:10px 0 0">${t("net.upstreams_note")}</p></div></div></section>`;
}

function presence(t, p) {
  // Le champ s'appelle speed_mbps : lu sous le nom "speed", il valait
  // undefined et chaque point d'echange affichait « —M ».
  const speed = s => s >= 1000 ? I18N.num(s / 1000) + "G" : I18N.num(s) + "M";
  return html`<div class="grid g2 section">
    <div class="card"><div class="card-b">
      <div class="section-h"><h2>${t("net.ixs")}</h2><span class="sub">${p.ixs.length}</span></div>
      <div class="scroll-x"><table class="t"><tbody>${p.ixs.map(x => html`<tr>
        <td>${x.name}</td>
        <td class="mono" style="text-align:right">${speed(x.speed_mbps)}</td>
        <td style="text-align:right">${x.rs_peer && html`<span class="badge b-n">RS</span>`}</td>
      </tr>`)}</tbody></table></div>
    </div></div>
    <div class="card"><div class="card-b">
      <div class="section-h"><h2>${t("net.facilities")}</h2><span class="sub">${p.facilities.length}</span></div>
      <table class="t"><tbody>${p.facilities.map(f => html`<tr>
        <td>${f.name}</td>
        <td class="muted" style="text-align:right">${f.city}${f.country && ", " + f.country}</td>
      </tr>`)}</tbody></table>
    </div></div>
  </div>`;
}

function render() {
  const t = I18N.t, box = document.getElementById("body");
  if (PENDING && !INFO) {
    H.render(box, html`<div class="note">${t("common.loading")}</div>`);
    return;
  }
  if (ERR) {
    H.render(box, html`<div class="note">${t("common.unavailable")} \u2014 ${ERR}</div>`);
    return;
  }
  if (!INFO) return;
  const i = INFO, p = i.peeringdb;
  document.getElementById("title").textContent = "AS" + i.asn + (i.holder ? " \u2014 " + i.holder : "");

  H.render(box, html`
    <div class="grid g4 section">
      ${stat(t("net.prefixes_v4"), I18N.num(i.prefixes_v4))}
      ${stat(t("net.prefixes_v6"), I18N.num(i.prefixes_v6))}
      ${stat(t("net.nb_up"), I18N.num(i.nb_upstreams))}
      ${stat(t("net.ixs"), p ? I18N.num(p.ixs.length) : "\u2014")}
    </div>
    <div class="grid g2 section">${routingCard(t, i)}${declaredCard(t, p)}</div>
    ${i.upstreams && i.upstreams.length > 0 && upstreams(t, i.upstreams)}
    ${p && (p.ixs.length > 0 || p.facilities.length > 0) && presence(t, p)}
    ${i.prefixes && i.prefixes.length > 0 && html`<section class="section">
      <div class="section-h"><h2>${t("net.sample_prefixes")}</h2></div>
      <div class="pill-list">${i.prefixes.map(x => html`<span>${x}</span>`)}</div></section>`}
    <div class="note">${t("net.sources")} :
      ${link(i.links.ripestat, "RIPEstat")}
      ${i.links.peeringdb && html` \u00b7 ${link(i.links.peeringdb, "PeeringDB")}`}
      \u00b7 ${link(i.links.bgptools, "bgp.tools")}.
      ${t("net.fetched", { date: I18N.date(i.fetched_at) })}</div>`);
}

const hash = (location.hash.match(/AS(\d+)/i) || [])[1];
// The data comes from RIPEstat and PeeringDB, fetched in the background: on
// a cold cache the server answers "pending" instead of making the visitor
// wait. A reverse proxy in front may also answer with an HTML error page,
// which must not surface as "Unexpected token '<'".
async function loadASN() {
  const r = await fetch(hash ? "/api/v1/asn/" + hash : "/api/v1/asn");
  const text = await r.text();
  let d = null;
  try { d = JSON.parse(text); } catch (e) {
    throw new Error(r.status >= 400
      ? `the server answered HTTP ${r.status} (a reverse proxy error page, not smokestack)`
      : "unexpected answer from the server");
  }
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

let RETRIES = 0;
function retryLater() {
  if (RETRIES++ > 10) return;
  setTimeout(() => loadASN().then(d => { INFO = d.pending ? null : d; PENDING = !!d.pending; render(); })
    .catch(e => { ERR = e.message; render(); }), 3000);
}

loadASN()
  .then(d => { if (d.pending) { PENDING = true; retryLater(); } else { INFO = d; } })
  .catch(e => { ERR = e.message; })
  .finally(() => App.boot("network", render));
</script>
</body>
</html>
