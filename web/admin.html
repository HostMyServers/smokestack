<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>smokestack — administration</title>
<style>
  :root{--ink:#0f172a;--ink2:#64748b;--ink3:#94a3b8;--line:#e4e9f0;--line2:#f1f5f9;
        --panel:#f8fafc;--blue:#2563eb;--ok:#15803d;--warn:#b45309;--crit:#dc2626;
        /* The back-office does not load app.css, so it carries the same
           radius scale rather than inheriting one it never sees. */
        --radius:6px;--radius-s:4px;--radius-xs:2px;--radius-pill:999px}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;outline-offset:-1px;border-color:#93c5fd}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .field{margin-bottom:11px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:7px 14px;
       font-size:13px;color:var(--ink)}
  .btn:hover{border-color:#93c5fd}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.p:hover{background:#1d4ed8}
  .btn.d{border-color:#fecaca;color:var(--crit)}
  .btn.d:hover{background:#fef2f2}
  .btn.s{padding:4px 10px;font-size:12px}
  .row2{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}

  /* entry screens */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--panel)}
  .gatebox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
           border-radius:var(--radius);padding:26px}
  .gatebox h1{font-size:18px;margin:0 0 4px}
  .gatebox p.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}
  .logo{width:26px;height:26px;border-radius:var(--radius-s);background:linear-gradient(135deg,#2563eb,#0891b2);
        display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;margin-bottom:14px}

  /* layout */
  .top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}
  .topin{display:flex;align-items:center;gap:14px;height:56px;padding:0 clamp(14px,2.5vw,28px)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand .logo{margin:0;width:22px;height:22px;font-size:11px}
  .spacer{flex:1}
  .who{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}
  .badge{border-radius:var(--radius-pill);padding:2px 9px;font-size:11px;font-weight:500}
  .terr{margin-top:4px;font-size:11.5px;color:var(--crit);max-width:520px;line-height:1.35}
  .twarn{margin-top:4px;font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;
         border-radius:var(--radius-s);padding:6px 8px;max-width:520px;line-height:1.4}
  .tpin{margin-top:4px;font-size:11.5px;color:var(--ink2)}
  .b-ok{background:#f0fdf4;color:var(--ok)}
  .b-warn{background:#fffbeb;color:var(--warn)}
  .b-crit{background:#fef2f2;color:var(--crit)}
  .b-n{background:var(--line2);color:var(--ink2)}

  .shell{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:900px){.shell{grid-template-columns:212px minmax(0,1fr)}}
  nav.side{border-right:1px solid var(--line);padding:14px 10px;background:var(--panel)}
  @media(min-width:900px){nav.side{min-height:calc(100vh - 56px)}}
  .burger{display:none;font-size:16px;line-height:1;padding:6px 10px}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:30}
  @media(max-width:899px){
    .burger{display:inline-flex}
    nav.side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:40;overflow-y:auto;
      transform:translateX(-100%);transition:transform .18s ease;box-shadow:0 10px 40px rgba(15,23,42,.18)}
    nav.side.open{transform:none}
    .topin{gap:8px}
    .who{display:none}
    .body{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:max-content}
    table.resp{min-width:0;width:100%}
    table.resp thead{display:none}
    table.resp tr{display:block;border-top:1px solid var(--line2);padding:10px 0}
    table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}
    table.resp td::before{content:attr(data-l);color:var(--ink3);font-size:11.5px;
      text-transform:uppercase;letter-spacing:.04em;text-align:left}
    table.resp td[data-l=""]::before{content:""}
    table.resp td.acts{flex-wrap:wrap;justify-content:flex-start;padding-top:8px}
    /* title, host and category stacked, not side by side */
    table.resp td.ttl{display:block;text-align:left;padding-bottom:6px}
  }
  nav.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:none;border:none;padding:8px 11px;border-radius:var(--radius-s);font-size:13px;color:var(--ink2)}
  nav.side button:hover{background:#fff}
  nav.side button[aria-current="true"]{background:#eff6ff;color:#1d4ed8;font-weight:500}
  nav.side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink3);margin:14px 11px 5px}
  .bbar{display:flex;height:5px;border-radius:var(--radius-xs);overflow:hidden;margin-top:5px;max-width:260px;background:var(--bg2)}
  .bseg{display:block;height:100%}
  .b-dns{background:#7a3fe0} .b-conn{background:#2458e6} .b-tls{background:#0f917a}
  nav.side .n{margin-left:auto;background:var(--crit);color:#fff;border-radius:var(--radius-pill);
    font-size:10px;padding:1px 6px;font-weight:600}

  main{padding:clamp(16px,2.4vw,28px);min-width:0}
  h2{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  .lead{font-size:13px;color:var(--ink2);margin:0 0 20px}
  .card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;
           font-weight:600;display:flex;align-items:center;gap:8px}
  .card .body{padding:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--ink2);font-size:11px;text-transform:uppercase;
     letter-spacing:.03em;padding:6px 10px}
  td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
  tr.dis td{opacity:.55}
  .note{font-size:12px;color:var(--ink2);background:var(--panel);border-radius:var(--radius-s);
        padding:10px 12px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
    background:#0f172a;color:#fff;padding:10px 16px;border-radius:var(--radius-s);font-size:13px;
    box-shadow:0 6px 24px rgba(15,23,42,.25);display:none;max-width:90vw}
  .toast.err{background:var(--crit)}
  .fp{font-size:15px;letter-spacing:.06em;font-weight:600}
  .empty{font-size:13px;color:var(--ink3);padding:6px 0}
  .pend{border:1px solid #fed7aa;background:#fffbeb;border-radius:var(--radius-s);padding:13px;margin-bottom:10px}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .quote{border-left:3px solid #fdba74;padding:6px 11px;margin:8px 0;font-size:13px;background:#fff}
  .quote.priv{border-left-color:#a5b4fc;background:#f5f7ff}
  .quote .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);display:block;margin-bottom:2px}
  .counter{font-size:11px;color:var(--ink3);text-align:right;margin-top:3px}
  .counter.bad{color:var(--crit)}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink);margin:10px 0}
  .chk input{width:auto;margin-top:3px}
  .chk small{display:block;color:var(--ink2);font-size:12px}
  .bar{height:6px;border-radius:var(--radius-xs);background:var(--line2);overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .diff td{background:#fffbeb}
  .hopnote{color:var(--crit);font-weight:600;margin-left:6px}
  /* Le point d'echange porte la meme couleur que sur les pages publiques :
     c'est le seul saut que le routage mondial ne nomme pas. */
  .ixb{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid #9fd5e2;
    border-radius:var(--radius-pill);background:#e4f4f8;color:#0b7f96;vertical-align:1px;
    font-size:9.5px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
  .ixb::before{content:"IX";margin-right:5px;opacity:.6}
  .trrow{cursor:pointer}
  .trrow:hover td{background:var(--panel)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:5px 11px;font-size:12px;color:var(--ink2)}
  .tabs button[aria-pressed="true"]{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="/html.js"></script>
<script src="/backoffice/core.js"></script>
<script src="/backoffice/gate.js"></script>
<script src="/backoffice/shell.js"></script>
<script src="/backoffice/dash.js"></script>
<script src="/backoffice/targets.js"></script>
<script src="/backoffice/traces.js"></script>
<script src="/backoffice/federation.js"></script>
<script src="/backoffice/notify.js"></script>
<script src="/backoffice/storage.js"></script>
<script src="/backoffice/site.js"></script>
<script src="/backoffice/network.js"></script>
<script src="/backoffice/languages.js"></script>
<script src="/backoffice/updates.js"></script>
<script src="/backoffice/channels.js"></script>
<script src="/backoffice/certs.js"></script>
<script src="/backoffice/maintenance.js"></script>
<script src="/backoffice/breakdown.js"></script>
<script src="/backoffice/doublecheck.js"></script>
<script src="/backoffice/audit.js"></script>
<script src="/backoffice/startup.js"></script>
</body>
</html>
