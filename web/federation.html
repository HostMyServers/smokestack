<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>Federation — smokestack</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="hdr" id="hdr"></header>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow" data-i18n="nav.federation"></p>
    <h1 data-i18n="fed.title"></h1>
    <p class="lead" data-i18n="fed.lead"></p>
  </div>
  <section class="section">
    <div class="section-h"><h2 data-i18n="fed.peers"></h2><span class="sub" id="count"></span></div>
    <div class="grid g3" id="peers"><p class="muted" data-i18n="common.loading"></p></div>
  </section>
  <section class="section">
    <div class="section-h"><h2 data-i18n="fed.matrix"></h2></div>
    <div class="card"><div class="card-b scroll-x" id="matrix"></div></div>
    <p class="faint" style="font-size:12.5px;margin-top:10px" data-i18n="fed.matrix_hint"></p>
  </section>
</main>
<footer class="ftr" id="ftr"></footer>
<script src="/html.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
const { html, url } = H;
let PEERS = null, MATRIX = null;
const lat = v => v == null ? "\u2014" : I18N.num(v, 1) + " ms";
const cls = (med, loss) => loss != null && loss > 2 ? "b-crit" : med != null && med > 40 ? "b-warn" : "b-ok";

function cellStyle(m) {
  if (m == null) return "background:var(--bg-sunk);color:var(--ink-3)";
  if (m < 10) return "background:var(--ok-soft);color:var(--ok)";
  if (m < 30) return "background:var(--warn-soft);color:var(--warn)";
  return "background:var(--crit-soft);color:var(--crit)";
}

// Everything on this page was sent by another instance: organisation,
// AS number, anchor names, website. fedsafe.go is the gate it crossed
// server-side; here the template is what keeps it text.
function peerCard(p, t) {
  const site = url(p.url);
  return html`
    <div class="card"><div class="card-b">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <strong style="font-size:15px">${p.org}</strong>
        <a class="mono" href="/network#AS${String(p.asn).replace(/\D/g, "")}">${p.asn}</a>
      </div>
      <div class="faint" style="font-size:12px;margin-top:2px">
        ${t("fed.since")} ${p.since ? I18N.date(p.since, { day: "2-digit", month: "short", year: "numeric" }) : "\u2014"}
      </div>
      <div class="grid g2" style="margin-top:14px;gap:10px">
        <div><div class="faint" style="font-size:11.5px">${t("fed.to_them")}</div>
          <span class="badge ${cls(p.to_med_ms, p.to_loss_pct)}">${lat(p.to_med_ms)}</span></div>
        <div><div class="faint" style="font-size:11.5px">${t("fed.from_them")}</div>
          <span class="badge ${cls(p.from_med_ms, p.from_loss_pct)}">${lat(p.from_med_ms)}</span></div>
      </div>
      <div style="margin-top:12px"><div class="faint" style="font-size:11.5px;margin-bottom:4px">${t("fed.anchors")}</div>
        <div class="pill-list">${(p.anchors || []).map(a => html`<span>${a}</span>`)}</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px">
        <span class="faint">${t("fed.last_seen")} : ${p.last_seen_at ? I18N.ago(p.last_seen_at) : "\u2014"}</span>
        ${site && html`<a href="${site}" rel="noopener noreferrer">${t("fed.visit")} \u2192</a>`}
      </div>
    </div></div>`;
}

function matrixTable(t) {
  const asns = [...new Set(MATRIX.flatMap(c => [c.from_asn, c.to_asn]))].sort();
  if (!asns.length) return html`<p class="faint">${t("fed.none")}</p>`;
  const cell = (f, to) => MATRIX.find(c => c.from_asn === f && c.to_asn === to);
  const row = f => html`<tr><td class="mono" style="font-weight:600">${f}</td>${asns.map(to => {
    const c = f === to ? null : cell(f, to);
    return html`<td><span class="badge mono" style="${cellStyle(c ? c.med_ms : null)}">${
      c ? I18N.num(c.med_ms, 1) : "\u2014"}</span></td>`;
  })}</tr>`;
  return html`<table class="t">
    <thead><tr><th>${t("fed.row_col")}</th>${asns.map(a => html`<th class="mono">${a}</th>`)}</tr></thead>
    <tbody>${asns.map(row)}</tbody></table>`;
}

function render(site) {
  const t = I18N.t;
  if (!PEERS) return;
  document.getElementById("count").textContent = PEERS.length ? String(PEERS.length) : "";
  H.render(document.getElementById("peers"), PEERS.length
    ? PEERS.map(p => peerCard(p, t))
    : html`<div class="note" data-i18n="fed.none">${t("fed.none")}</div>`);
  if (MATRIX) H.render(document.getElementById("matrix"), matrixTable(t));
}

Promise.all([
  fetch("/api/v1/fed/peers").then(r => r.ok ? r.json() : []).catch(() => []),
  fetch("/api/v1/fed/matrix").then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([p, m]) => { PEERS = p || []; MATRIX = m || []; App.boot("federation", render); });
</script>
</body>
</html>
