<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>About — smokestack</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="hdr" id="hdr"></header>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow" data-i18n="nav.about"></p>
    <h1 data-i18n="about.title"></h1>
    <p class="lead" id="desc"></p>
  </div>
  <div class="grid g2 section">
    <div class="card"><div class="card-b">
      <div class="section-h"><h2 data-i18n="about.operator"></h2></div><div id="operator"></div>
    </div></div>
    <div class="card"><div class="card-b">
      <div class="section-h"><h2 data-i18n="about.contact"></h2></div><div id="contact"></div>
      <div id="cform"></div>
      <p class="faint" style="font-size:12.5px;margin:12px 0 0" data-i18n="about.noc_note"></p>
    </div></div>
  </div>
  <section class="section">
    <div class="section-h"><h2 data-i18n="about.method"></h2></div>
    <div class="card"><div class="card-b muted" style="font-size:14px">
      <p style="margin-top:0" data-i18n="about.method_p1"></p>
      <p data-i18n="about.method_p2"></p>
      <p style="margin-bottom:0" data-i18n="about.method_p3"></p>
    </div></div>
  </section>
  <section class="section">
    <div class="section-h"><h2 data-i18n="about.instance"></h2></div>
    <p class="muted" style="font-size:13px;margin-top:0" data-i18n="about.instance_lead"></p>
    <div class="grid g2">
      <div class="card"><div class="card-b">
        <div class="section-h"><h3 style="font-size:15px;margin:0" data-i18n="about.probe_net"></h3></div>
        <div id="probenet"></div>
      </div></div>
      <div class="card"><div class="card-b">
        <div class="section-h"><h3 style="font-size:15px;margin:0" data-i18n="about.platform"></h3></div>
        <div id="platform"></div>
      </div></div>
    </div>
  </section>
  <section class="section" id="legalSec">
    <div class="section-h"><h2 data-i18n="about.legal"></h2></div>
    <p class="muted" style="font-size:13px" id="legal"></p>
  </section>
</main>
<footer class="ftr" id="ftr"></footer>
<script src="/html.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
const { html, url } = H;

const kv = rows => html`<div class="kv">${rows.filter(r => r[1]).map(r =>
  html`<div class="k">${I18N.t(r[0])}</div><div class="v">${r[1]}</div>`)}</div>`;

const mailto = addr => addr && html`<a href="mailto:${addr}">${addr}</a>`;
const out = (href, label) => {
  const u = url(href);
  return u && html`<a href="${u}" rel="noopener">${label}</a>`;
};

function render(s) {
  const asnNum = String(s.asn || "").replace(/\D/g, "");
  document.getElementById("desc").textContent = s.description || "";
  H.render(document.getElementById("operator"), kv([
    ["about.org", s.org],
    ["about.asn", asnNum && html`<a class="mono" href="/network">${s.asn}</a>`],
    ["about.owner", s.owner],
    ["about.location", s.location],
    ["about.timezone", s.timezone],
    ["about.peeringdb", out(s.peeringdb, "\u2197")]
  ]));
  contactForm(s);
  H.render(document.getElementById("contact"), kv([
    ["about.email", mailto(s.email)],
    ["about.noc", mailto(s.noc_email)],
    ["about.website", out(s.url, String(s.url || "").replace(/^https?:\/\//, ""))]
  ]));
  document.getElementById("legal").textContent = s.legal || "";
  document.getElementById("legalSec").hidden = !s.legal;
  renderInstance();
}

// What this instance is, and which network its packets leave from. A
// measurement with no stated origin is of no use to whoever reads it.
// The address itself is not published: the reverse name and the network
// situate the probe, which is the same rule applied to the targets.
async function renderInstance() {
  const t = I18N.t;
  let v = null;
  try { v = await fetch("/api/v1/instance").then(r => r.ok ? r.json() : null); }
  catch (e) { /* the page is worth showing without it */ }
  if (!v) return;
  const n = String(v.asn || "").replace(/\D/g, "");
  const links = n && html`
    <a href="https://www.peeringdb.com/asn/${n}" rel="noopener" target="_blank">PeeringDB \u2197</a>
    \u00b7 <a href="https://stat.ripe.net/app/launchpad/AS${n}" rel="noopener" target="_blank">RIPEstat \u2197</a>`;
  const dur = s => {
    if (!s) return "";
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
  };
  const size = b => b >= (1 << 30) ? Math.round(b / (1 << 30)) + " GB"
    : b ? Math.round(b / (1 << 20)) + " MB" : "";
  H.render(document.getElementById("probenet"), kv([
    ["about.reverse", v.reverse],
    ["about.network", v.behind_nat ? t("about.behind_nat")
      : v.network && html`<span class="mono">${v.network}</span>`],
    ["about.family", v.family ? "IPv" + v.family : ""],
    ["about.asn", v.asn && html`<span class="mono">${v.asn}</span>`],
    ["about.as_name", v.as_name || v.net_name],
    ["about.check", links]
  ]));
  H.render(document.getElementById("platform"), kv([
    ["about.version", v.version],
    ["about.cpu", v.cpu_cores ? (v.cpu_model ? v.cpu_model + " \u00b7 " : "") +
      v.cpu_cores + " " + t("about.cores") : ""],
    ["about.ram", size(v.ram_bytes)],
    ["about.uptime", dur(v.uptime_s)],
    ["about.platform_k", v.platform]
  ]));
}
App.boot("about", render);

/* ------------------------------------------------------- contact form */
/* The operator's address stays private: visitors write from here and the
   message lands in the back-office. */
// Four ways to be reachable: the form, an address assembled in JavaScript
// (a harvester reading the HTML finds nothing), links to your own tools, or
// nothing at all.
function contactMode(site) {
  const m = site.contact_mode;
  if (m === "form" || m === "email" || m === "links" || m === "off") return m;
  return site.contact_form ? "form" : "off";
}

// A proof-of-work check instead of a third-party captcha: nothing to read,
// so it works in every language, and no visitor data leaves the instance.
async function solveChallenge(state) {
  const c = await fetch("/api/v1/contact/challenge").then(r => r.json());
  const enc = new TextEncoder();
  const need = c.bits;
  const zeros = buf => {
    let n = 0;
    for (const byte of new Uint8Array(buf)) {
      if (byte === 0) { n += 8; continue; }
      for (let m = 128; m > 0; m >>= 1) { if (byte & m) return n; n++; }
      return n;
    }
    return n;
  };
  for (let i = 0; i < 20e6; i++) {
    const nonce = String(i);
    const h = await crypto.subtle.digest("SHA-256", enc.encode(c.salt + nonce));
    if (zeros(h) >= need) return { salt: c.salt, ts: c.ts, sig: c.sig, nonce };
    if (i % 2000 === 0 && state) state.textContent = I18N.t("contact.verifying");
  }
  throw new Error("verification failed");
}

function contactAlternatives(site) {
  const box = document.getElementById("cform"), t = I18N.t;
  const mode = contactMode(site);
  if (mode === "email" && site.email) {
    // Assembled at display time, never present as text in the HTML.
    const [user, domain] = site.email.split("@");
    H.render(box, html`<div class="card" style="margin-top:14px"><div class="card-b">
      <h3 style="margin:0 0 8px;font-size:15px">${t("contact.title")}</h3>
      <div id="cmail"></div></div></div>`);
    const a = document.createElement("a");
    a.href = "mailto:" + user + String.fromCharCode(64) + domain;
    a.textContent = user + String.fromCharCode(64) + domain;
    const wrap = document.getElementById("cmail");
    wrap.appendChild(a);
    return;
  }
  if (mode === "links" && (site.contact_links || []).length) {
    H.render(box, html`<div class="card" style="margin-top:14px"><div class="card-b">
      <h3 style="margin:0 0 8px;font-size:15px">${t("contact.other_ways")}</h3>
      <ul style="margin:0;padding-left:18px">${site.contact_links.map(l =>
        html`<li>${out(l.url, l.label || l.url)}</li>`)}</ul>
      </div></div>`);
  }
}

function contactForm(site) {
  const box = document.getElementById("cform");
  if (!box) return;
  if (contactMode(site) !== "form") { contactAlternatives(site); return; }
  const t = I18N.t;
  H.render(box, html`<div class="card" style="margin-top:14px"><div class="card-b">
    <h3 style="margin:0 0 4px;font-size:15px">${t("contact.title")}</h3>
    <p class="faint" style="font-size:13px;margin:0 0 14px">${t("contact.lead")}</p>
    <div class="cf-grid">
      <label>${t("contact.name")}<input id="cf-name" maxlength="120" autocomplete="name"></label>
      <label>${t("contact.email")}<input id="cf-mail" type="email" maxlength="200" autocomplete="email"></label>
    </div>
    <label class="cf-full">${t("contact.subject")}
      <input id="cf-sub" maxlength="200" placeholder="${t("contact.subject_ph")}"></label>
    <label class="cf-full">${t("contact.message")}
      <textarea id="cf-msg" rows="5" maxlength="4000"></textarea></label>
    <input id="cf-web" class="cf-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-primary" id="cf-send">${t("contact.send")}</button>
      <span id="cf-state" class="faint" style="font-size:13px"></span>
    </div>
    <p class="faint" style="font-size:11.5px;margin:12px 0 0">${t("contact.privacy")}</p>
  </div></div>`);
  const state = document.getElementById("cf-state"), btn = document.getElementById("cf-send");
  btn.onclick = async () => {
    btn.disabled = true; state.style.color = ""; state.textContent = t("contact.sending");
    try {
      let proof = {};
      if (site.captcha) proof = await solveChallenge(state);
      const r = await fetch("/api/v1/contact", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          salt: proof.salt, sig: proof.sig, nonce: proof.nonce, ts: proof.ts,
          name: document.getElementById("cf-name").value,
          email: document.getElementById("cf-mail").value,
          subject: document.getElementById("cf-sub").value,
          message: document.getElementById("cf-msg").value,
          website: document.getElementById("cf-web").value,
          lang: I18N.lang
        })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.status);
      H.render(box, html`<div class="card" style="margin-top:14px"><div class="card-b">
        <span class="badge b-ok">${t("contact.sent")}</span></div></div>`);
    } catch (e) {
      state.style.color = "var(--crit)";
      state.textContent = t("contact.error") + " " + e.message;
      btn.disabled = false;
    }
  };
}
</script>
</body>
</html>
